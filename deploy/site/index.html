<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dungeon books</title>
<meta name="description" content="ssh shop.dungeonbooks.com">
<meta property="og:title" content="dungeon books">
<meta property="og:description" content="ssh shop.dungeonbooks.com">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🕯️</text></svg>">
<style>
  @font-face {
    font-family: "RuneScape Quill";
    src: url("/fonts/RuneScape-Quill.ttf") format("truetype");
    font-display: swap;
  }
  @font-face {
    font-family: "RuneScape Plain";
    src: url("/fonts/RuneScape-Plain-12.ttf") format("truetype");
    font-display: swap;
  }

  :root {
    --bg: hsl(0 0% 7%);
    --ink: hsl(0 0% 78%);
    --gold: hsl(45 65% 58%);
    --dim: hsl(0 0% 34%);
  }

  * { box-sizing: border-box; }

  html { height: 100%; }

  body {
    margin: 0;
    min-height: 100%;
    padding: 12vh 1.5rem 4rem;
    background: var(--bg);
    color: var(--ink);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 15px;
    line-height: 2;
    -webkit-font-smoothing: antialiased;
  }

  main {
    max-width: 34rem;
    margin: 0 auto;
  }

  h1 {
    font-family: "RuneScape Quill", serif;
    font-weight: 400;
    font-size: 2.1rem;
    letter-spacing: .02em;
    color: var(--gold);
    margin: 0 0 3rem;
    line-height: 1;
  }

  p { margin: 0 0 2rem; }

  .cmd {
    display: flex;
    align-items: baseline;
    gap: 1rem;
    margin: 0 0 3rem;
  }

  .cmd code {
    color: var(--gold);
    font-size: 1.05rem;
    word-break: break-all;
  }

  button {
    font: inherit;
    font-size: .8rem;
    color: var(--dim);
    background: none;
    border: 0;
    padding: 0;
    cursor: pointer;
    text-transform: lowercase;
  }
  button:hover { color: var(--ink); }
  button:focus-visible { outline: 1px solid var(--dim); outline-offset: 3px; }

  dl {
    margin: 0;
    font-size: .8rem;
    color: var(--dim);
    line-height: 1.9;
  }
  dt { display: none; }
  dd { margin: 0; word-break: break-all; }

  a { color: inherit; text-decoration: none; border-bottom: 1px solid var(--dim); }
  a:hover { color: var(--ink); }

  @media (max-width: 480px) {
    body { padding-top: 8vh; }
    .cmd { flex-direction: column; gap: .25rem; }
  }
</style>
</head>
<body>
<main>
  <h1>dungeon books</h1>

  <p>one book a month. the shelf is only open over ssh.</p>

  <div class="cmd">
    <code id="cmd">ssh shop.dungeonbooks.com</code>
    <button id="copy" type="button">copy</button>
  </div>

  <dl>
    <dt>host key</dt>
    <dd>SHA256:EXv5X+C23tnnR0ftxRP/Iq+3z3rL1ezcpbAy9S+zXLg</dd>
    <dt>store</dt>
    <dd><a href="https://www.dungeonbooks.com/">dungeonbooks.com</a></dd>
  </dl>
</main>

<script>
  const btn = document.getElementById("copy");
  btn.addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(document.getElementById("cmd").textContent);
      btn.textContent = "copied";
      setTimeout(() => (btn.textContent = "copy"), 1500);
    } catch {
      btn.textContent = "copy failed";
      setTimeout(() => (btn.textContent = "copy"), 1500);
    }
  });
</script>
</body>
</html>
