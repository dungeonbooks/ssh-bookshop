name: ci

on:
  push:
    branches: [main]
  pull_request:

# A second push to a pull request makes the first run pointless. Not on main,
# where cancelling would kill a deploy halfway.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Follows the toolchain in go.mod rather than pinning a version here
          # that would quietly drift from it.
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          # Assigning from a substitution swallows the exit status, so a broken
          # gofmt would read as "nothing unformatted". Fail on it explicitly.
          if ! unformatted="$(gofmt -l .)"; then
            echo "gofmt failed to run"
            exit 1
          fi
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: build
        run: go build ./...

      # -race is the point of this workflow: checkout runs off the UI goroutine,
      # and the shop takes money, so a data race is not a cosmetic problem.
      # -count=1 defeats the test cache: a cached pass proves nothing about a
      # race, which is exactly the kind of failure that only shows up sometimes.
      - name: test
        run: go test -count=1 -race ./...

  # The apex Worker in deploy/edge is TypeScript, so it gets its own job. No
  # deploy here: that still needs a Cloudflare token the repo does not hold.
  edge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/edge
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: deploy/edge/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: deploy/edge/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # wrangler types, then tsc.
      - run: pnpm check

      # Bundles the Worker without uploading it, so a broken import of the
      # llms.txt fails here rather than at deploy time.
      - run: pnpm exec wrangler deploy --dry-run

  # Every push to main that passes the tests goes live. The runner joins the
  # tailnet as an ephemeral node whose tag can reach only the shop's admin
  # port, and the key it holds can run only the deploy script, which takes a
  # release on stdin and rolls itself back if the shop does not come up.
  # Setup and the secrets are in deploy/README.md.
  #
  # The repo is public, so this log is too. The host and its key live in the
  # production environment's secrets, which Actions masks, and the deploy
  # script prints only its own status lines.
  deploy:
    needs: test
    # DEPLOY_ENABLED is a repository variable, set once the setup is done, so
    # main stays green until then.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      # Pinned by commit: this job holds deploy credentials.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # No cache: the test job writes it, through actions pinned only by tag,
      # and what is built here goes to production. Modules are still checked
      # against go.sum.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false

      - name: build release
        run: deploy/release.sh > "$RUNNER_TEMP/release.tar"

      - uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          umask 077
          dir="$RUNNER_TEMP/ssh"
          mkdir -p "$dir"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$dir/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$dir/known_hosts"
          ssh -i "$dir/key" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$dir/known_hosts" \
            -o LogLevel=ERROR "deploy@$DEPLOY_HOST" < "$RUNNER_TEMP/release.tar"
